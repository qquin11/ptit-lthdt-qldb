# =============================================================================
# FlatLightLaf overrides cho ResMan POS
# Auto-loaded bởi FlatLaf khi UIManager.setLookAndFeel(new FlatLightLaf())
# Tham khảo: https://www.formdev.com/flatlaf/properties-files/
# =============================================================================

# --- Brand accent (primary color) ---
@accentColor = #2563EB

# --- Component shape: rounded corners theo design tokens (radius md=8) ---
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
ProgressBar.arc = 8
CheckBox.arc = 4

# --- Focus ring: 2px accent (focus-visible UX) ---
Component.focusWidth = 2
Component.innerFocusWidth = 0

# --- Buttons ---
Button.default.background = @accentColor
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #1D4ED8
Button.default.pressedBackground = #1E40AF

# --- ScrollBar: thinner, modern ---
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
ScrollBar.showButtons = false

# --- Table ---
Table.rowHeight = 32
Table.alternateRowColor = #F8FAFC
Table.gridColor = #E2E8F0

# --- Tooltip ---
ToolTip.background = #1E293B
ToolTip.foreground = #F1F5F9
ToolTip.borderColor = #1E293B
