# =============================================================================
# FlatDarkLaf overrides cho ResMan POS
# Auto-loaded bởi FlatLaf khi UIManager.setLookAndFeel(new FlatDarkLaf())
# =============================================================================

# --- Brand accent (lighter blue cho dark bg, contrast tốt hơn) ---
@accentColor = #3B82F6

# --- Component shape ---
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
ProgressBar.arc = 8
CheckBox.arc = 4

# --- Focus ring ---
Component.focusWidth = 2
Component.innerFocusWidth = 0

# --- Buttons ---
Button.default.background = @accentColor
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #60A5FA
Button.default.pressedBackground = #2563EB

# --- ScrollBar ---
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
ScrollBar.showButtons = false

# --- Table ---
Table.rowHeight = 32
Table.alternateRowColor = #1E293B
Table.gridColor = #334155

# --- Tooltip ---
ToolTip.background = #F1F5F9
ToolTip.foreground = #0F172A
ToolTip.borderColor = #94A3B8
